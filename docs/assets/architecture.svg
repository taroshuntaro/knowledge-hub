<rect x="420" y="232" width="416" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><clipPath id="ac3"><rect x="420" y="232" width="416" height="66" rx="10"/></clipPath><rect x="420" y="232" width="4" height="66" fill="#4f46e5" clip-path="url(#ac3)" opacity="0.65"/><text x="438" y="256" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">routes/*（Hono ルート）</text><text x="438" y="276" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">/api/auth /api/articles /api/comments /api/notifications</text><text x="438" y="292" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">/api/uploads /api/search /api/admin … + guards.requireUuidParam</text>
<rect x="420" y="314" width="416" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><clipPath id="ac4"><rect x="420" y="314" width="416" height="76" rx="10"/></clipPath><rect x="420" y="314" width="4" height="76" fill="#4f46e5" clip-path="url(#ac4)" opacity="0.65"/><text x="438" y="338" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">services/*（ドメインロジック）</text><text x="438" y="358" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">記事・カテゴリ・タグ・コメント・エンゲージメント・通知</text><text x="438" y="374" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">検索（pg_bigm）・アップロード・認証 / セッション・OIDC</text><text x="438" y="390" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">article-visibility / cursor で可視性とページングを一元化</text>
<rect x="420" y="406" width="416" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><clipPath id="ac5"><rect x="420" y="406" width="416" height="62" rx="10"/></clipPath><rect x="420" y="406" width="4" height="62" fill="#4f46e5" clip-path="url(#ac5)" opacity="0.65"/><text x="438" y="430" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">db — Drizzle ORM</text><text x="438" y="450" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">schema.ts が唯一の発生源</text><text x="438" y="466" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">db:generate → db:migrate で差分 SQL を適用</text>
