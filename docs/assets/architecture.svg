<rect x="418" y="98" width="222.5" height="28" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="529.24" y="117" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">app コンテナ（Node.js 24 / Hono）</text>
