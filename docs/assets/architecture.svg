<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="838" viewBox="0 0 1280 838" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Segoe UI', sans-serif" role="img"><rect width="1280" height="838" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/></marker><marker id="arrowi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f46e5"/></marker></defs>
<!-- knowledge-hub architecture diagram. AWS resource icons: AWS Architecture Icons (official asset package). -->
<title>knowledge-hub アプリケーション構成図</title>
<desc>ブラウザの React SPA、app コンテナ（Hono）、PostgreSQL / オブジェクトストレージ / SMTP / OIDC IdP、および契約を担う packages/shared の関係を示した構成図。</desc>
<text x="40" y="46" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">knowledge-hub — アプリケーション構成</text>
<text x="40" y="72" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start">ブラウザの React SPA と Hono API が packages/shared の Zod スキーマを契約として共有する。外部依存は PostgreSQL / S3 互換ストレージ / SMTP / OIDC IdP の 4 つ。</text>
<rect x="40" y="112" width="240" height="548" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<clipPath id="ac1"><rect x="40" y="112" width="240" height="548" rx="12"/></clipPath><rect x="40" y="112" width="240" height="5" fill="#4f46e5" clip-path="url(#ac1)"/>
<text x="60" y="146" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">apps/web</text>
<text x="60" y="166" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">React 19 SPA（Vite）/ ブラウザ</text>
<line x1="60" y1="184" x2="260" y2="184" stroke="#cbd5e1"/>
<text x="60" y="210" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・React Router / TanStack Query</text>
<text x="60" y="246" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・hc&lt;AppType&gt; 型付きクライアント</text>
<text x="60" y="282" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・Tiptap ⇔ CodeMirror エディタ</text>
<text x="60" y="318" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・shadcn/ui + Tailwind v4</text>
<text x="60" y="354" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・RequireAuth / RequireRole 保護</text>
<text x="60" y="390" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・useCursorList でページング</text>
<text x="60" y="426" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・errorMessage() でエラー表示</text>
<line x1="60" y1="460" x2="260" y2="460" stroke="#cbd5e1"/>
<text x="60" y="490" font-size="11.5" fill="#4f46e5" font-weight="700" text-anchor="start">開発時</text>
<text x="60" y="514" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">Vite dev server :5173</text>
<text x="60" y="538" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">/api は :3000 へ proxy</text>
<text x="60" y="574" font-size="11.5" fill="#4f46e5" font-weight="700" text-anchor="start">本番</text>
<text x="60" y="598" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">Hono が web の dist を静的配信</text>
<rect x="400" y="112" width="456" height="548" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="7 6"/>
<rect x="418" y="98" width="222.5" height="28" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
<text x="529.24" y="117" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">app コンテナ（Node.js 24 / Hono）</text>
<rect x="420" y="150" width="416" height="85" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><clipPath id="ac2"><rect x="420" y="150" width="416" height="85" rx="10"/></clipPath><rect x="420" y="150" width="4" height="85" fill="#4f46e5" clip-path="url(#ac2)" opacity="0.65"/><text x="438" y="178" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">middleware</text><text x="438" y="200" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">request-logger / security-headers（CSP・HSTS）/ origin-check</text><text x="438" y="217" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">session（Cookie）/ admin / requirePasswordAuth</text>
<rect x="420" y="251" width="416" height="85" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><clipPath id="ac3"><rect x="420" y="251" width="416" height="85" rx="10"/></clipPath><rect x="420" y="251" width="4" height="85" fill="#4f46e5" clip-path="url(#ac3)" opacity="0.65"/><text x="438" y="279" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">routes/*（Hono ルート）</text><text x="438" y="301" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">/api/auth /api/articles /api/comments /api/notifications</text><text x="438" y="318" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">/api/uploads /api/search /api/admin … + guards.requireUuidParam</text>
<rect x="420" y="352" width="416" height="102" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><clipPath id="ac4"><rect x="420" y="352" width="416" height="102" rx="10"/></clipPath><rect x="420" y="352" width="4" height="102" fill="#4f46e5" clip-path="url(#ac4)" opacity="0.65"/><text x="438" y="380" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">services/*（ドメインロジック）</text><text x="438" y="402" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">記事・カテゴリ・タグ・コメント・エンゲージメント・通知</text><text x="438" y="419" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">検索（pg_bigm）・アップロード・認証 / セッション・OIDC</text><text x="438" y="436" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">article-visibility / cursor で可視性とページングを一元化</text>
<rect x="420" y="470" width="416" height="85" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><clipPath id="ac5"><rect x="420" y="470" width="416" height="85" rx="10"/></clipPath><rect x="420" y="470" width="4" height="85" fill="#4f46e5" clip-path="url(#ac5)" opacity="0.65"/><text x="438" y="498" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="start">db — Drizzle ORM</text><text x="438" y="520" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">schema.ts が唯一の発生源</text><text x="438" y="537" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">db:generate → db:migrate で差分 SQL を適用</text>
