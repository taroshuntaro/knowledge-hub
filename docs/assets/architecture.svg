<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', 'Noto Sans CJK JP', 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Segoe UI', sans-serif" role="img"><rect width="1280" height="730" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/></marker><marker id="arrowi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4f46e5"/></marker></defs>
<!-- knowledge-hub architecture diagram. AWS resource icons: AWS Architecture Icons (official asset package). -->
<title>knowledge-hub アプリケーション構成図</title>
<desc>ブラウザの React SPA、app コンテナ（Hono）、PostgreSQL / オブジェクトストレージ / SMTP / OIDC IdP、および契約を担う packages/shared の関係を示した構成図。</desc>
<text x="40" y="46" font-size="21" fill="#0f172a" font-weight="700" text-anchor="start">knowledge-hub — アプリケーション構成</text>
<text x="40" y="72" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start">ブラウザの React SPA と Hono API が packages/shared の Zod スキーマを契約として共有する。外部依存は PostgreSQL / S3 互換ストレージ / SMTP / OIDC IdP の 4 つ。</text>
<rect x="40" y="112" width="240" height="440" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<clipPath id="ac1"><rect x="40" y="112" width="240" height="440" rx="12"/></clipPath><rect x="40" y="112" width="240" height="5" fill="#4f46e5" clip-path="url(#ac1)"/>
<text x="60" y="146" font-size="14.5" fill="#0f172a" font-weight="700" text-anchor="start">apps/web</text>
<text x="60" y="166" font-size="11" fill="#64748b" font-weight="400" text-anchor="start">React 19 SPA（Vite）/ ブラウザ</text>
<line x1="60" y1="184" x2="260" y2="184" stroke="#cbd5e1"/>
<text x="60" y="210" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・React Router / TanStack Query</text>
<text x="60" y="237" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・hc&lt;AppType&gt; 型付きクライアント</text>
<text x="60" y="264" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・Tiptap ⇔ CodeMirror エディタ</text>
<text x="60" y="291" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・shadcn/ui + Tailwind v4</text>
<text x="60" y="318" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・RequireAuth / RequireRole 保護</text>
<text x="60" y="345" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・useCursorList でページング</text>
<text x="60" y="372" font-size="11" fill="#0f172a" font-weight="400" text-anchor="start">・errorMessage() でエラー表示</text>
<line x1="60" y1="400" x2="260" y2="400" stroke="#cbd5e1"/>
<text x="60" y="426" font-size="11.5" fill="#4f46e5" font-weight="700" text-anchor="start">開発時</text>
<text x="60" y="446" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">Vite dev server :5173</text>
<text x="60" y="466" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">/api は :3000 へ proxy</text>
<text x="60" y="496" font-size="11.5" fill="#4f46e5" font-weight="700" text-anchor="start">本番</text>
<text x="60" y="518" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">Hono が web の dist を静的配信</text>
