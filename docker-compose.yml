services:
  db:
    build: ./docker/db
    environment:
      POSTGRES_USER: khub
      POSTGRES_PASSWORD: khub
      POSTGRES_DB: khub
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khub"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
  # MinIO 公式イメージ（minio/minio・minio/mc）は Docker Hub から削除されたため Bitnami 版を使う。
  # Bitnami 版は MINIO_DEFAULT_BUCKETS でバケットを起動時に作るので、mc の使い捨てジョブは不要。
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: knowledge-hub   # S3_BUCKET と揃える
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-bitnami-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
  # 開発用 IdP（手動 SSO 検証用）。普段は起動しない: docker compose --profile idp up -d
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: ["idp"]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin        # dev 専用
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin        # dev 専用
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
volumes:
  db-data: {}
  minio-bitnami-data: {}
